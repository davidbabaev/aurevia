<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="aurevia-favicon-title">
  <title id="aurevia-favicon-title">Aurevia</title>
  <!--
    Panel 5 of the sheet: the mark on a white rounded square.

    Fills are literal rather than currentColor — a favicon is referenced from
    <link> and never inherits a colour from the page.

    This is a small-size cut of the mark, not a redraw. Two deliberate
    departures from logo-mark.svg, both forced by the 16px case:

      1. The inner wedges are dropped. At 16px the whole mark is ~11px wide,
         so each wedge is under a pixel and the white gap that separates it
         from its leg is thinner still. Kept in, they only muddy the leg edge.
      2. The centre stripe is widened from 1.6..4.2 units to 7..12 and starts
         higher, at y 34 instead of 49.3. At source proportions it measures
         two thirds of one pixel at 16px and disappears entirely.

    What survives at 16px is the silhouette and the blue centre line, which
    is the part that carries the brand.
  -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF" />
  <g transform="translate(10 14.4) scale(0.44)">
    <path fill="#080A0D" d="M41.5 0H58.5L100 80H88.3L50 14.1L11.7 80H0Z" />
    <path fill="#3A8EFC" d="M46.5 34H53.5L56 80H44Z" />
  </g>
</svg>
